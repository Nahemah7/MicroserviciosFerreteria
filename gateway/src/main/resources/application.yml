spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://localhost:5174
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
      routes:
        - id: usuarios-service
          uri: lb://usuarios-service
          predicates:
            - Path=/api/usuarios/**
        - id: usuarios-openapi
          uri: lb://usuarios-service
          predicates:
            - Path=/usuarios/v3/api-docs,/usuarios/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: tienda-service
          uri: lb://tienda-service
          predicates:
            - Path=/api/productos/**,/api/carrito/**,/api/comentarios/**
        - id: tienda-openapi
          uri: lb://tienda-service
          predicates:
            - Path=/tienda/v3/api-docs,/tienda/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: pedidos-service
          uri: lb://pedidos-service
          predicates:
            - Path=/api/pedidos/**
        - id: pedidos-openapi
          uri: lb://pedidos-service
          predicates:
            - Path=/pedidos/v3/api-docs,/pedidos/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: notificaciones-service
          uri: lb://notificaciones-service
          predicates:
            - Path=/api/notificaciones/**
        - id: notificaciones-openapi
          uri: lb://notificaciones-service
          predicates:
            - Path=/notificaciones/v3/api-docs,/notificaciones/v3/api-docs/**
          filters:
            - StripPrefix=1
  main:
    web-application-type: reactive

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Usuarios API
        url: /usuarios/v3/api-docs
      - name: Tienda API
        url: /tienda/v3/api-docs
      - name: Pedidos API
        url: /pedidos/v3/api-docs
      - name: Notificaciones API
        url: /notificaciones/v3/api-docs
